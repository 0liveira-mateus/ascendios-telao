<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Telão</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
// Telão do Ascendios RP: toca um vídeo do YouTube dentro de uma página https (o YouTube recusa players sem
// site de origem, Erro 153). Parâmetros: v (id do vídeo), start (segundos), loop (1), vol (0-100).
// Avisa a página do jogo (postMessage) quando o vídeo não pode tocar ou termina.
(function () {
  var q = new URLSearchParams(location.search);
  var v = q.get("v") || "";
  var start = Math.max(0, parseInt(q.get("start"), 10) || 0);
  var loop = q.get("loop") === "1";
  var vol = Math.min(100, Math.max(0, parseInt(q.get("vol"), 10)));
  if (!isFinite(vol)) vol = 60;
  function avisar(tipo, codigo) {
    try { parent.postMessage({ ascendioTelao: tipo, codigo: codigo || 0, v: v }, "*"); } catch (e) {}
  }
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) { avisar("erro", 2); return; }
  window.onYouTubeIframeAPIReady = function () {
    new YT.Player("player", {
      host: "https://www.youtube-nocookie.com",
      videoId: v,
      playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, disablekb: 1, iv_load_policy: 3, start: start, loop: loop ? 1 : 0, playlist: loop ? v : undefined },
      events: {
        onReady: function (e) { try { e.target.setVolume(vol); e.target.playVideo(); } catch (x) {} avisar("pronto"); },
        onError: function (e) { avisar("erro", e.data); },
        onStateChange: function (e) { if (e.data === 0 && !loop) avisar("fim"); }
      }
    });
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = function () { avisar("erro", 1); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
